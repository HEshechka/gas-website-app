version: '3.8'

services:
  # Сервис для Backend
  backend:
    build:
      context: ./backend # Путь к директории с backend
    container_name: myapp-backend
    restart: unless-stopped
    env_file:
      - .env # Файл с переменными окружения
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    networks:
      - app-network
    depends_on:
      - db

  # Сервис для Frontend (сборка)
  frontend:
    build:
      context: ./frontend # Путь к директории с frontend
    container_name: myapp-frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Пробрасываем порт для доступа к собранному frontend
    networks:
      - app-network

  # Сервис для PostgreSQL
  db:
    image: postgres:14-alpine
    container_name: myapp-db
    restart: unless-stopped
    env_file:
      - .env # Файл с переменными окружения
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # Сохранение данных
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge