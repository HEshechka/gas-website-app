version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: gas-website-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gas_website}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in GitHub Variables or local .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gas_website}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in GitHub Variables or local .env}
        PORT: ${PORT:-3000}
    container_name: gas-website-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in GitHub Variables or local .env}
    ports:
      - "${PORT:-3000}:3000"
    command: sh -c "npm run start"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PORT:-3000}/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
